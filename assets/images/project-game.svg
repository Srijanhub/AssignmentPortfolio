<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="p4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>
  </defs>
  <rect width="500" height="300" rx="16" fill="url(#p4-bg)" />
  <!-- Game Console Mockup -->
  <rect x="50" y="30" width="400" height="240" rx="12" fill="#18181B" stroke="#F43F5E" stroke-width="1.5" />
  
  <text x="80" y="65" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FB7185">🎮 Retro Number Guessing Quest</text>
  <text x="80" y="85" font-family="sans-serif" font-size="11" fill="#FDA4AF">I picked a secret number between 1 and 100. Can you guess it?</text>

  <!-- Game screen -->
  <rect x="80" y="105" width="340" height="80" rx="8" fill="#09090B" stroke="#27272A" />
  <text x="180" y="138" font-family="monospace" font-size="28" font-weight="bold" fill="#F43F5E">42</text>
  <text x="250" y="145" font-family="sans-serif" font-size="13" fill="#34D399" font-weight="bold">🎯 "Too Low! Try higher..."</text>
  <text x="100" y="170" font-family="sans-serif" font-size="11" fill="#A1A1AA">Attempts remaining: 5 | Best Score: 4 guesses</text>

  <!-- Input and Guess button -->
  <rect x="80" y="200" width="210" height="40" rx="6" fill="#27272A" stroke="#52525B" />
  <text x="100" y="225" font-family="monospace" font-size="14" fill="#E4E4E7">Enter guess: 78</text>

  <rect x="305" y="200" width="115" height="40" rx="6" fill="#E11D48" />
  <text x="362" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GUESS 🎲</text>
</svg>