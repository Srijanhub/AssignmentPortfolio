<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="dp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#3F3F46" />
    </linearGradient>
  </defs>
  <rect width="500" height="300" rx="16" fill="url(#dp-grad)" />

  <!-- Mac Native Flight Deck Window -->
  <rect x="35" y="25" width="430" height="250" rx="10" fill="#09090B" stroke="#52525B" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="35" y="25" width="430" height="36" rx="10" fill="#18181B" />
  <circle cx="55" cy="43" r="5" fill="#EF4444" />
  <circle cx="73" cy="43" r="5" fill="#F59E0B" />
  <circle cx="91" cy="43" r="5" fill="#10B981" />
  <text x="115" y="47" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F43F5E">DayPilot 🛸 Flight Deck macOS</text>
  <rect x="345" y="33" width="105" height="20" rx="10" fill="#27272A" stroke="#71717A" />
  <text x="397" y="47" font-family="sans-serif" font-size="10" font-weight="bold" fill="#A1A1AA" text-anchor="middle">MODE: STUDY</text>

  <!-- Left Stats Widgets -->
  <g transform="translate(55, 75)">
    <rect x="0" y="0" width="170" height="85" rx="8" fill="#18181B" stroke="#27272A" />
    <text x="15" y="22" font-family="sans-serif" font-size="10" fill="#A1A1AA">BossCoder Curriculum</text>
    <text x="15" y="48" font-family="sans-serif" font-size="20" font-weight="bold" fill="#38BDF8">84%</text>
    <text x="15" y="68" font-family="sans-serif" font-size="9" fill="#4ADE80">Web Dev Modules Cleared</text>

    <rect x="0" y="95" width="170" height="85" rx="8" fill="#18181B" stroke="#27272A" />
    <text x="15" y="117" font-family="sans-serif" font-size="10" fill="#A1A1AA">Active Workstream</text>
    <text x="15" y="142" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FCD34D">Assignment 1</text>
    <text x="15" y="162" font-family="sans-serif" font-size="9" fill="#94A3B8">Portfolio Website Build</text>
  </g>

  <!-- Right Terminal / Telemetry Feed -->
  <g transform="translate(240, 75)">
    <rect x="0" y="0" width="205" height="180" rx="8" fill="#030712" stroke="#27272A" />
    <text x="12" y="25" font-family="monospace" font-size="10" fill="#10B981">&gt; DayPilot Daemon running</text>
    <text x="12" y="45" font-family="monospace" font-size="9" fill="#64748B">Workspace: /Web_Dev/Assignment1</text>
    <text x="12" y="65" font-family="monospace" font-size="9" fill="#93C5FD">Syncing GitHub PR reviews...</text>
    <text x="12" y="85" font-family="monospace" font-size="9" fill="#A78BFA">Focus Mode: ON (Notifications mute)</text>
    
    <line x1="12" y1="100" x2="190" y2="100" stroke="#1F2937" />
    <text x="12" y="120" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F43F5E">Weekly Coding Hours:</text>
    <rect x="12" y="132" width="180" height="8" rx="4" fill="#1F2937" />
    <rect x="12" y="132" width="145" height="8" rx="4" fill="#F43F5E" />
    <text x="12" y="158" font-family="monospace" font-size="9" fill="#D4D4D8">32.5 hrs logged this week</text>
