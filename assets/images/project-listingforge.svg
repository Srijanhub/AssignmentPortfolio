<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="lf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
  </defs>
  <rect width="500" height="300" rx="16" fill="url(#lf-grad)" />

  <!-- Studio Frame -->
  <rect x="35" y="25" width="430" height="250" rx="10" fill="#0B0F19" stroke="#6366F1" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="35" y="25" width="430" height="36" rx="10" fill="#1E293B" />
  <circle cx="55" cy="43" r="5" fill="#EF4444" />
  <circle cx="73" cy="43" r="5" fill="#F59E0B" />
  <circle cx="91" cy="43" r="5" fill="#10B981" />
  <text x="115" y="47" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">ListingForge ⚡ AI Studio</text>
  <rect x="360" y="33" width="90" height="20" rx="10" fill="#4F46E5" />
  <text x="405" y="47" font-family="sans-serif" font-size="10" font-weight="bold" fill="#EEF2FF" text-anchor="middle">Open-Weight AI</text>

  <!-- Left: Photo uploader simulation -->
  <rect x="55" y="75" width="140" height="180" rx="8" fill="#1E293B" stroke="#334155" stroke-dasharray="3,3" />
  <circle cx="125" cy="140" r="28" fill="#312E81" />
  <path d="M125 125 L125 155 M110 140 L140 140" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <text x="125" y="185" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Product Images</text>
  <text x="125" y="200" font-family="sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Etsy • eBay • Shopify</text>

  <!-- Right: Generated Listing preview -->
  <rect x="210" y="75" width="235" height="180" rx="8" fill="#111827" stroke="#374151" />
  <text x="225" y="98" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">SEO Optimized Title Generated:</text>
  <rect x="225" y="106" width="205" height="12" rx="3" fill="#1F2937" />
  <rect x="225" y="122" width="160" height="10" rx="3" fill="#1F2937" />

  <text x="225" y="150" font-family="sans-serif" font-size="10" font-weight="bold" fill="#A855F7">Etsy High-Rank Tags (13/13):</text>
  <rect x="225" y="158" width="55" height="16" rx="4" fill="#312E81" />
  <text x="252" y="170" font-family="sans-serif" font-size="8" fill="#C7D2FE" text-anchor="middle">#handmade</text>

  <rect x="285" y="158" width="55" height="16" rx="4" fill="#312E81" />
  <text x="312" y="170" font-family="sans-serif" font-size="8" fill="#C7D2FE" text-anchor="middle">#artisan</text>

  <rect x="345" y="158" width="55" height="16" rx="4" fill="#312E81" />
  <text x="372" y="170" font-family="sans-serif" font-size="8" fill="#C7D2FE" text-anchor="middle">#vintage</text>

  <rect x="225" y="180" width="65" height="16" rx="4" fill="#312E81" />
  <text x="257" y="192" font-family="sans-serif" font-size="8" fill="#C7D2FE" text-anchor="middle">#topranked</text>

  <rect x="295" y="180" width="60" height="16" rx="4" fill="#312E81" />
  <text x="325" y="192" font-family="sans-serif" font-size="8" fill="#C7D2FE" text-anchor="middle">#zerocost</text>

  <!-- Button: Export Listing -->
  <rect x="225" y="212" width="205" height="28" rx="6" fill="#4F46E5" />
  <text x="327" y="230" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Export to eBay &amp; Etsy 🚀</text>
</svg>