      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#003087" />
    </linearGradient>
  </defs>
  <rect width="500" height="300" rx="16" fill="url(#mandate-grad)" />

  <!-- Shield & Firewall UI Frame -->
  <rect x="35" y="25" width="430" height="250" rx="10" fill="#0A0F1D" stroke="#0079C1" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="35" y="25" width="430" height="36" rx="10" fill="#1E293B" />
  <circle cx="55" cy="43" r="5" fill="#EF4444" />
  <circle cx="73" cy="43" r="5" fill="#F59E0B" />
  <circle cx="91" cy="43" r="5" fill="#10B981" />
