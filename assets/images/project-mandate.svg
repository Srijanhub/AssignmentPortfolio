    <rect x="0" y="20" width="100" height="70" rx="8" fill="#1E293B" stroke="#64748B" />
    <text x="50" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F1F5F9" text-anchor="middle">AI Agent</text>
    <text x="50" y="66" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Buy item &lt; $60</text>

    <!-- Arrow 1 -->
    <path d="M105 55 L135 55" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" />
    <polygon points="135,51 143,55 135,59" fill="#38BDF8" />

    <!-- Node 2: Mandate Firewall Engine -->
    <rect x="150" y="10" width="130" height="90" rx="8" fill="#0F172A" stroke="#0079C1" stroke-width="2" />
    <circle cx="215" cy="35" r="14" fill="#003087" />
    <text x="215" y="40" font-family="sans-serif" font-size="12" fill="#38BDF8" text-anchor="middle">🛡️</text>
    <text x="215" y="65" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Mandate Core</text>
    <text x="215" y="82" font-family="sans-serif" font-size="9" fill="#34D399" text-anchor="middle">Intent Verified ✓</text>

    <!-- Arrow 2 -->
    <polygon points="295,51 303,55 295,59" fill="#34D399" />
    <line x1="282" y1="55" x2="295" y2="55" stroke="#34D399" stroke-width="2" />

    <!-- Node 3: PayPal Settlement -->
    <rect x="310" y="20" width="100" height="70" rx="8" fill="#003087" stroke="#0079C1" />
    <text x="360" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PayPal API</text>
    <text x="360" y="66" font-family="sans-serif" font-size="9" fill="#93C5FD" text-anchor="middle">Orders v2 Settled</text>
  </g>

  <!-- Security Audit Logs box -->
  <rect x="55" y="195" width="390" height="60" rx="6" fill="#0F172A" stroke="#334155" />
  <text x="70" y="215" font-family="monospace" font-size="10" fill="#22C55E">✓ [C1-C8 Passed] Prompt Injection Sanitized: clean</text>
  <text x="70" y="232" font-family="monospace" font-size="10" fill="#38BDF8">✓ Intent Receipt Generated: #rcpt_98fa201b (Immutable)</text>
  <text x="70" y="247" font-family="monospace" font-size="9" fill="#94A3B8">PayPal AI Hackathon 2026 • Python • FastAPI • PostgreSQL</text>
